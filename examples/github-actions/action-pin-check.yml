name: action-pin-check

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  action-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install action-pin-check
        run: python -m pip install git+https://github.com/itscloud0/action-pin-check.git@v0.4.1
      - name: Audit workflow action refs
        run: action-pin-check .github/workflows --fail-on error
