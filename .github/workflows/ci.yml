name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Smoke test CLI
        run: action-pin-check examples/workflows --fail-on never

  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Install public release
        run: python -m pip install "git+https://github.com/itscloud0/action-pin-check.git@v0.7.0"
      - name: Smoke test public release
        run: action-pin-check examples/workflows --fail-on never

  public-archive-install:
    name: Immutable public source archive install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Install public release archive
        run: python -m pip install "https://github.com/itscloud0/action-pin-check/archive/e656bf11670c28d2b0d6c64b615a43f697cbd0e4.tar.gz"
      - name: Smoke test archive install
        shell: bash
        run: |
          python -m action_pin_check --version
          mkdir -p "$RUNNER_TEMP/action-pin-check-archive-smoke/.github/workflows"
          printf '%s\n' 'steps:' '  - uses: actions/checkout@v4' > "$RUNNER_TEMP/action-pin-check-archive-smoke/.github/workflows/unsafe.yml"
          action-pin-check "$RUNNER_TEMP/action-pin-check-archive-smoke/.github/workflows" --fail-on never
